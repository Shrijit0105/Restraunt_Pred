<svg
width="900"
height="430"
viewBox="0 0 900 430"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient
    id="bg"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%">

    <stop
      offset="0%"
      stop-color="#050505"/>

    <stop
      offset="100%"
      stop-color="#111111"/>

  </linearGradient>

  <filter
    id="glow">

    <feGaussianBlur
      stdDeviation="3"
      result="blur"/>

    <feMerge>

      <feMergeNode
        in="blur"/>

      <feMergeNode
        in="SourceGraphic"/>

    </feMerge>

  </filter>

  <style>

    .title {
      font-family:
      monospace;

      font-size:
      24px;

      font-weight:
      bold;

      fill:
      #ffffff;
    }

    .subtitle {
      font-family:
      monospace;

      font-size:
      12px;

      fill:
      #777777;
    }

    .label {
      font-family:
      monospace;

      font-size:
      11px;

      fill:
      #888888;
    }

    .value {
      font-family:
      monospace;

      font-size:
      14px;

      fill:
      #ffffff;
    }

    .status {
      font-family:
      monospace;

      font-size:
      13px;

      font-weight:
      bold;

      fill:
      #ffffff;
    }

    .bar-bg {
      fill:
      #252525;
    }

    .bar {
      fill:
      #ffffff;
    }

    .pulse {
      animation:
      pulse 1.6s
      infinite;
    }

    .scan {
      animation:
      scan 4s
      linear
      infinite;
    }

    @keyframes pulse {

      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }

      100% {
        opacity: 1;
      }

    }

    @keyframes scan {

      0% {
        transform:
        translateX(-900px);
      }

      100% {
        transform:
        translateX(900px);
      }

    }

  </style>

</defs>


<!-- Background -->

<rect
  width="900"
  height="430"
  rx="18"
  fill="url(#bg)"
  stroke="#333333"/>


<!-- Animated scan -->

<rect
  class="scan"
  x="0"
  y="0"
  width="2"
  height="430"
  opacity="0.25"
  fill="#ffffff"/>


<!-- Header -->

<text
  x="40"
  y="48"
  class="title">

  RESTAURANT RATING PREDICTION

</text>

<text
  x="40"
  y="70"
  class="subtitle">

  AI / ML PORTFOLIO PROJECT

</text>


<!-- Status -->

<circle
  cx="790"
  cy="48"
  r="7"
  fill="#ffffff"
  class="pulse"
  filter="url(#glow)"/>

<text
  x="805"
  y="53"
  class="status">

  ACTIVE

</text>


<!-- Pipeline -->

<text
  x="40"
  y="115"
  class="label">

  ML PIPELINE

</text>


<!-- Pipeline bars -->

<text
  x="40"
  y="145"
  class="label">

  DATA

</text>

<rect
  x="90"
  y="136"
  width="120"
  height="10"
  rx="5"
  class="bar-bg"/>

<rect
  x="90"
  y="136"
  width="120"
  height="10"
  rx="5"
  class="bar"/>


<text
  x="240"
  y="145"
  class="label">

  CLEANING

</text>

<rect
  x="315"
  y="136"
  width="120"
  height="10"
  rx="5"
  class="bar-bg"/>

<rect
  x="315"
  y="136"
  width="120"
  height="10"
  rx="5"
