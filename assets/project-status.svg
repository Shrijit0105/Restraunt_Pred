  FEATURES

</text>

<rect
  x="540"
  y="136"
  width="120"
  height="10"
  rx="5"
  class="bar-bg"/>

<rect
  x="540"
  y="136"
  width="102"
  height="10"
  rx="5"
  class="bar"/>


<text
  x="690"
  y="145"
  class="label">

  MODEL

</text>

<rect
  x="745"
  y="136"
  width="115"
  height="10"
  rx="5"
  class="bar-bg"/>

<rect
  x="745"
  y="136"
  width="69"
  height="10"
  rx="5"
  class="bar"/>


<!-- Current focus -->

<rect
  x="40"
  y="180"
  width="820"
  height="70"
  rx="10"
  fill="#0b0b0b"
  stroke="#292929"/>

<text
  x="60"
  y="207"
  class="label">

  CURRENT FOCUS

</text>

<text
  x="60"
  y="230"
  class="value">

  Feature Engineering / Model Development

</text>


<!-- Statistics -->

