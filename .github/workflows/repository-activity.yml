name: Repository Activity Tracker

on:
  push:
    branches:
      - main
      - master

  pull_request:
    types:
      - opened
      - closed
      - synchronize

  issues:
    types:
      - opened
      - closed
      - reopened

  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  activity:
    name: Update Repository Activity
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # --------------------------------------------------
      # 2. Generate activity information
      # --------------------------------------------------

      - name: Generate activity report
        shell: bash
        run: |

          mkdir -p outputs

          REPO="${GITHUB_REPOSITORY}"
          EVENT="${GITHUB_EVENT_NAME}"
          BRANCH="${GITHUB_REF_NAME}"

          COMMIT_HASH=$(git rev-parse HEAD)

          COMMIT_MESSAGE=$(git log -1 --pretty=%s)

          COMMIT_AUTHOR=$(git log -1 --pretty=%an)

          COMMIT_DATE=$(git log -1 --format=%aI)

          TOTAL_COMMITS=$(git rev-list --count HEAD)

          UPDATED=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          cat > outputs/repository-activity.json <<EOF
          {
            "repository": "$REPO",
            "event": "$EVENT",
            "branch": "$BRANCH",
            "latest_commit": {
              "hash": "$COMMIT_HASH",
              "message": "$COMMIT_MESSAGE",
              "author": "$COMMIT_AUTHOR",
              "date": "$COMMIT_DATE"
            },
            "statistics": {
              "total_commits": $TOTAL_COMMITS
            },
            "updated_at": "$UPDATED"
          }
          EOF

          echo "----------------------------------------"
          echo "Repository Activity"
          echo "----------------------------------------"
          echo "Repository: $REPO"
          echo "Event:      $EVENT"
          echo "Branch:     $BRANCH"
          echo "Commit:     $COMMIT_HASH"
          echo "Author:     $COMMIT_AUTHOR"
          echo "Commits:    $TOTAL_COMMITS"
          echo "Updated:    $UPDATED"
          echo "----------------------------------------"

      # --------------------------------------------------
      # 3. Update README
      # --------------------------------------------------

      - name: Update README activity section
        shell: bash
        run: |

          START="<!-- ACTIVITY_START -->"
          END="<!-- ACTIVITY_END -->"

          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_SHORT=${COMMIT_HASH:0:7}

          COMMIT_MESSAGE=$(git log -1 --pretty=%s)

          COMMIT_AUTHOR=$(git log -1 --pretty=%an)

          TOTAL_COMMITS=$(git rev-list --count HEAD)

          EVENT="${GITHUB_EVENT_NAME}"

          BRANCH="${GITHUB_REF_NAME}"

          UPDATED=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > /tmp/activity.md <<EOF
          <!-- ACTIVITY_START -->

          ## ⚡ Repository Activity

          | Metric | Value |
          |---|---|
          | Latest Commit | \`$COMMIT_MESSAGE\` |
          | Author | $COMMIT_AUTHOR |
          | Commit | \`$COMMIT_SHORT\` |
          | Event | \`$EVENT\` |
          | Branch | \`$BRANCH\` |
          | Total Commits | \`$TOTAL_COMMITS\` |
          | Last Updated | \`$UPDATED\` |

          > Automatically generated by GitHub Actions.

          <!-- ACTIVITY_END -->
          EOF

          if grep -q "$START" README.md && grep -q "$END" README.md; then

            python3 <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          activity = Path("/tmp/activity.md")

          text = readme.read_text(encoding="utf-8")
          new_activity = activity.read_text(encoding="utf-8").strip()

          start = "<!-- ACTIVITY_START -->"
          end = "<!-- ACTIVITY_END -->"

          start_index = text.index(start)
          end_index = text.index(end) + len(end)

          updated = (
              text[:start_index]
              + new_activity
              + text[end_index:]
          )

          readme.write_text(updated, encoding="utf-8")
          PY

          else

            printf "\n\n$(cat /tmp/activity.md)\n" >> README.md

          fi

      # --------------------------------------------------
      # 4. Show changes
      # --------------------------------------------------

      - name: Check generated changes
        run: |

          echo "Changed files:"
          git status --short

          echo ""
          echo "README activity:"
          grep -A15 \
            "<!-- ACTIVITY_START -->" \
            README.md || true

      # --------------------------------------------------
      # 5. Commit changes
      # --------------------------------------------------

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add outputs/repository-activity.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "chore: update repository activity"

      # --------------------------------------------------
      # 6. Push changes
      # --------------------------------------------------

      - name: Push changes
        run: |

          git push origin HEAD:${GITHUB_REF_NAME}
